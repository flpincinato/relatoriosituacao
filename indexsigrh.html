<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapas Interativos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9fb;
      color: #333;
      text-align: center;
    }
     
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 2rem auto;
      gap: 1rem;
    }
    a {
      display: block;
      width: 250px;
      padding: 1rem;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-decoration: none;
      color: #218C85;
      font-weight: bold;
      transition: transform 0.2s, background 0.3s;
    }
    a:hover {
      transform: scale(1.05);
      background: #e6f0ff;
    }
    
  </style>
</head>
<body>
   

  <div class="container">
    <a href="https://sigrh.sp.gov.br/iqa" target="_blank">💦 Índice de Qualidade da Água - IQA</a>
    <a href="https://sigrh.sp.gov.br/iap" target="_blank">🚰 Índice de Qualidade da Água Bruta para fins de Abastecimento Público - IAP</a>
    <a href="https://sigrh.sp.gov.br/iet" target="_blank">🌊 Índice de Estado Trófico - IET</a>
  </div>
  
  
</body>
</html>
